<svg xmlns="http://www.w3.org/2000/svg" width="880" height="800" viewBox="0 0 880 800" font-family="Arial, Helvetica, sans-serif" font-size="13">
<rect width="880" height="800" fill="#ffffff"/>

<!-- User -->
<rect x="340" y="30" width="320" height="208" fill="#ffffff" stroke="#185FA5" stroke-width="1.5"/>
<rect x="340" y="30" width="320" height="34" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<text x="500" y="52" text-anchor="middle" font-weight="bold" font-size="15" fill="#0C447C">User</text>
<line x1="340" y1="206" x2="660" y2="206" stroke="#185FA5" stroke-width="1.5"/>
<g fill="#222">
<text x="350" y="80">- id : number</text>
<text x="350" y="102">- name : string</text>
<text x="350" y="124">- email : string</text>
<text x="350" y="146">- password : string</text>
<text x="350" y="168">- phone : string</text>
<text x="350" y="190">- age : number  (18 - 60)</text>
<text x="350" y="227">+ displayInfo() : void</text>
</g>

<!-- Admin -->
<rect x="40" y="100" width="240" height="86" fill="#ffffff" stroke="#185FA5" stroke-width="1.5"/>
<rect x="40" y="100" width="240" height="34" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<text x="160" y="122" text-anchor="middle" font-weight="bold" font-size="15" fill="#0C447C">Admin</text>
<line x1="40" y1="154" x2="280" y2="154" stroke="#185FA5" stroke-width="1.5"/>
<text x="50" y="175" fill="#222">+ manageNotes() : void</text>

<!-- Inheritance Admin -> User -->
<line x1="280" y1="143" x2="322" y2="143" stroke="#333" stroke-width="1.5"/>
<polygon points="340,143 322,135 322,151" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<text x="286" y="131" font-size="12" fill="#444" font-style="italic">extends</text>

<!-- NoteBook -->
<rect x="340" y="330" width="320" height="164" fill="#ffffff" stroke="#0F6E56" stroke-width="1.5"/>
<rect x="340" y="330" width="320" height="34" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="500" y="352" text-anchor="middle" font-weight="bold" font-size="15" fill="#085041">NoteBook</text>
<line x1="340" y1="440" x2="660" y2="440" stroke="#0F6E56" stroke-width="1.5"/>
<g fill="#222">
<text x="350" y="380">- id : number</text>
<text x="350" y="402">- title : string</text>
<text x="350" y="424">- notes : Array&lt;Note&gt;</text>
<text x="350" y="456">+ addNote(note : Note) : void</text>
<text x="350" y="478">+ removeNote(noteId : number) : void</text>
</g>

<!-- Aggregation User to NoteBook -->
<polygon points="500,238 510,256 500,274 490,256" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<line x1="500" y1="274" x2="500" y2="330" stroke="#333" stroke-width="1.5"/>
<text x="518" y="254" font-size="12" fill="#444">1</text>
<text x="508" y="324" font-size="12" fill="#444">0..*</text>
<text x="520" y="304" font-size="12" fill="#444" font-style="italic">owns</text>

<!-- Note -->
<rect x="340" y="590" width="320" height="164" fill="#ffffff" stroke="#0F6E56" stroke-width="1.5"/>
<rect x="340" y="590" width="320" height="34" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="500" y="612" text-anchor="middle" font-weight="bold" font-size="15" fill="#085041">Note</text>
<line x1="340" y1="722" x2="660" y2="722" stroke="#0F6E56" stroke-width="1.5"/>
<g fill="#222">
<text x="350" y="640">- id : number</text>
<text x="350" y="662">- title : string</text>
<text x="350" y="684">- content : string</text>
<text x="350" y="706">- userId : User  (author)</text>
<text x="350" y="743">+ preview() : string</text>
</g>

<!-- Composition NoteBook to Note -->
<polygon points="500,494 510,512 500,530 490,512" fill="#333" stroke="#333" stroke-width="1.5"/>
<line x1="500" y1="530" x2="500" y2="590" stroke="#333" stroke-width="1.5"/>
<text x="518" y="510" font-size="12" fill="#444">1</text>
<text x="508" y="584" font-size="12" fill="#444">0..*</text>
<text x="520" y="564" font-size="12" fill="#444" font-style="italic">contains</text>

<!-- Association Note -> User -->
<polyline points="660,670 790,670 790,100 660,100" fill="none" stroke="#333" stroke-width="1.5"/>
<polyline points="676,93 660,100 676,107" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="668" y="86" font-size="12" fill="#444">1</text>
<text x="668" y="662" font-size="12" fill="#444">0..*</text>
<text x="800" y="390" font-size="12" fill="#444" font-style="italic">author</text>

<!-- Storage<T> -->
<rect x="40" y="330" width="260" height="152" fill="#ffffff" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="0"/>
<rect x="40" y="330" width="260" height="44" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="170" y="346" text-anchor="middle" font-size="11" font-style="italic" fill="#3C3489">&lt;&lt;generic&gt;&gt;</text>
<text x="170" y="365" text-anchor="middle" font-weight="bold" font-size="15" fill="#3C3489">Storage&lt;T&gt;</text>
<line x1="40" y1="406" x2="300" y2="406" stroke="#534AB7" stroke-width="1.5"/>
<g fill="#222">
<text x="50" y="395">- items : Array&lt;T&gt;</text>
<text x="50" y="428">+ addItem(item : T) : void</text>
<text x="50" y="450">+ removeItem(item : T) : void</text>
<text x="50" y="472">+ getAllItems() : Array&lt;T&gt;</text>
</g>

<!-- Legend -->
<rect x="30" y="600" width="280" height="150" fill="#ffffff" stroke="#999" stroke-width="1"/>
<text x="42" y="622" font-weight="bold" fill="#222">Relationships</text>
<line x1="44" y1="646" x2="84" y2="646" stroke="#333" stroke-width="1.5"/>
<polygon points="102,646 84,638 84,654" fill="#ffffff" stroke="#333" stroke-width="1.5" transform="translate(-0,0)"/>
<text x="116" y="650" fill="#222">Inheritance (Admin - User)</text>
<polygon points="44,676 54,668 64,676 54,684" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
<line x1="64" y1="676" x2="102" y2="676" stroke="#333" stroke-width="1.5"/>
<text x="116" y="680" fill="#222">Aggregation (User - NoteBook)</text>
<polygon points="44,706 54,698 64,706 54,714" fill="#333" stroke="#333" stroke-width="1.5"/>
<line x1="64" y1="706" x2="102" y2="706" stroke="#333" stroke-width="1.5"/>
<text x="116" y="710" fill="#222">Composition (NoteBook - Note)</text>
<line x1="44" y1="736" x2="102" y2="736" stroke="#333" stroke-width="1.5"/>
<polyline points="88,729 102,736 88,743" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="116" y="740" fill="#222">Association (Note - User)</text>
</svg>
